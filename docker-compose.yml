services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env   # DATABASE_URL must point at host.docker.internal (override via shell env DATABASE_URL)
    environment:
      - DATABASE_URL
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
