services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env   # set DATABASE_URL host to host.docker.internal when using Docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
